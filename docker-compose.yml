services:
  sales-agent:
    build: .
    command: ["python", "-m", "app.main", "v2-daemon"]
    restart: unless-stopped
    init: true
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./prompts:/app/prompts:ro
    stop_grace_period: 30s
